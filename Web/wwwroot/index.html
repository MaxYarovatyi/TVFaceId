<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minister ID</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #07070f; color: #e2e2e2; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  header {
    background: #0f0f1a; border-bottom: 1px solid #1e1e30;
    padding: 12px 20px; display: flex; align-items: center;
    justify-content: space-between;
  }
  .logo { font-size: 15px; font-weight: 700; color: #fff; }
  .logo span { color: #4f8ef7; }

  .conn-status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #6b7280; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; }
  .dot.on { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }

  main { padding: 24px 20px; display: flex; flex-wrap: wrap; gap: 18px; align-content: flex-start; }

  .empty { width: 100%; text-align: center; padding-top: 100px; color: #2e2e48; font-size: 18px; }
  .empty svg { display: block; margin: 0 auto 12px; opacity: .15; }

  .card {
    background: #0f0f1a; border: 1px solid #1a1a2e;
    border-radius: 14px; width: 210px; overflow: hidden;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1} }

  .card-photo {
    width: 100%; height: 185px; object-fit: cover;
    object-position: center top; background: #111; display: block;
  }
  .card-body { padding: 12px; }

  .card-name {
    font-size: 14px; font-weight: 600; display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #e2e2e2; text-decoration: none; cursor: pointer;
    transition: color .15s;
  }
  .card-name:hover { color: #4f8ef7; text-decoration: underline; }

  .card-country { font-size: 11px; color: #6b7280; margin-top: 2px; }
  .card-role    { font-size: 10px; color: #4b5563; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .conf-row { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
  .conf-track { flex: 1; height: 3px; background: #1e1e30; border-radius: 99px; overflow: hidden; }
  .conf-fill  { height: 100%; border-radius: 99px; background: linear-gradient(90deg,#3b82f6,#22c55e); transition: width .4s; }
  .conf-val   { font-size: 10px; color: #4b5563; min-width: 28px; text-align: right; }
</style>
</head>
<body>

<header>
  <div class="logo">Minister <span>ID</span></div>
  <div class="conn-status">
    <div class="dot" id="dot"></div>
    <span id="connText">Connecting…</span>
  </div>
</header>

<main id="main">
  <div class="empty">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
    </svg>
    Waiting for faces…
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script>
const dot      = document.getElementById('dot');
const connText = document.getElementById('connText');

const conn = new signalR.HubConnectionBuilder()
  .withUrl('/hub/recognition')
  .withAutomaticReconnect([2000, 3000, 5000, 10000])
  .build();

conn.on('RecognitionUpdate', faces => {
  const main = document.getElementById('main');

  if (!faces?.length) {
    main.innerHTML = `
      <div class="empty">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        No faces detected
      </div>`;
    return;
  }

  main.innerHTML = faces.map(f => `
    <div class="card">
      <img class="card-photo" src="${f.photoUrl ?? ''}" alt="${f.name}"
           onerror="this.style.background='#1a1a2e'">
      <div class="card-body">
        <a class="card-name"
           href="https://www.google.com/search?q=${encodeURIComponent(f.name + ' ' + f.country)}"
           target="_blank" rel="noopener"
           title="Search on Google">
          ${f.name}
        </a>
        <div class="card-country">${f.country}</div>
        <div class="card-role" title="${f.role}">${f.role}</div>
        <div class="conf-row">
          <div class="conf-track">
            <div class="conf-fill" style="width:${f.confidence}%"></div>
          </div>
          <div class="conf-val">${f.confidence}%</div>
        </div>
      </div>
    </div>`).join('');
});

conn.onreconnecting(() => { dot.className='dot'; connText.textContent='Reconnecting…'; });
conn.onreconnected(() => { dot.classList.add('on'); connText.textContent='Connected'; });
conn.onclose(()     => { dot.className='dot'; connText.textContent='Disconnected'; });

conn.start().then(() => {
  dot.classList.add('on');
  connText.textContent = 'Connected';
});
</script>
</body>
</html>
